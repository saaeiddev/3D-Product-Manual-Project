<style>
:root{

*{box-sizing:border-box} html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}

.header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--ink);padding:0 18px;gap:18px;background:var(--paper)}

.header-actions{display:flex;align-items:center;gap:8px}.lang{display:flex;border:1px solid var(--ink)}.lang button{background:transparent;border:0;padding:8px 10px;cursor:pointer;font-size:11px;font-weight:800}.lang button.active{background:var(--ink);color:var(--white)}.header-btn{width:38px;height:38px;border:1px solid var(--ink);background:transparent;cursor:pointer}.header-btn:hover{background:var(--accent);color:white}
.workspace{min-height:0;display:grid;grid-template-columns:250px minmax(430px,1fr) 320px;gap:0}
.product-rail{min-height:0;border-right:1px solid var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper)}
.rail-head{padding:18px;border-bottom:1px solid var(--line)}.kicker{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:800}.rail-head h2{font-size:26px;line-height:.94;margin:7px 0 0;letter-spacing:-.06em}.product-list{overflow:auto;padding:9px}.product-card{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;padding:9px;cursor:pointer;min-height:62px}.product-card:hover{border-color:var(--line);background:#fff8}.product-card.active{border-color:var(--ink);background:var(--ink);color:var(--white)}.product-index{width:38px;height:38px;border:1px solid currentColor;display:grid;place-items:center;font-size:10px;font-weight:900}.product-card .name{font-size:12px;font-weight:800;line-height:1.15}.product-card .type{font-size:9px;opacity:.58;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}.product-card .arrow{font-size:16px}.rail-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.45}.rail-foot b{color:var(--ink)}
.stage-wrap{position:relative;min-width:0;min-height:0;background:var(--stage);overflow:hidden}.stage-wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 75%);pointer-events:none}.stage-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 0 28%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.45) 100%)}
#threeHost{position:absolute;inset:0;z-index:1}.webgl{width:100%;height:100%;display:block}.labels-layer{position:absolute;inset:0;pointer-events:none;z-index:4}
.stage-top{position:absolute;z-index:5;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.stage-title{color:var(--white);max-width:66%}.stage-title .eyebrow{display:inline-block;background:var(--accent);color:white;padding:5px 8px;font-size:9px;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.stage-title h2{font-size:34px;line-height:.93;letter-spacing:-.065em;margin:9px 0 6px}.stage-title p{font-size:11px;color:#aaa99f;margin:0;max-width:520px}.model-stats{color:#cfcec5;text-align:right;font:10px/1.5 monospace}.model-stats b{color:var(--accent-2)}

.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--stage);color:var(--white)}.loading-card{width:min(360px,calc(100% - 38px));border:1px solid #5f6058;padding:20px;background:#1d1e19}.loading-top{display:flex;justify-content:space-between;font:10px monospace;color:#bab9b0}.loading h3{font-size:22px;margin:10px 0;letter-spacing:-.04em}.load-track{height:5px;background:#3a3b34;margin:15px 0 10px}.load-fill{height:100%;background:var(--accent);width:0}.error{color:#ff8c77;font-size:11px;line-height:1.5}.retry{border:1px solid var(--accent);background:var(--accent);color:white;padding:9px 11px;cursor:pointer;font-weight:800;margin-top:10px}

.mobile-products,.mobile-info{display:none}
html[dir="rtl"] body{font-family:Tahoma,Arial,sans-serif}html[dir="rtl"] .product-card,html[dir="rtl"] .component-btn{text-align:right}html[dir="rtl"] .model-stats{text-align:left}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const UI={
 en:{catalog:'Product Catalog',catalogSub:'SELECT A SYSTEM TO INSPECT',library:'07 verified interactive studies',components:'Components',function:'What it does',details:'Technical notes',source:'Asset source',search:'Search components…',explode:'Explode',assemble:'Assemble',reset:'Reset',auto:'Auto rotate',hotspots:'Hotspots',focus:'Focus',loading:'Loading 3D asset',clickHint:'Click the model or a hotspot to inspect a part',ready:'MODEL READY',failed:'Model source could not be loaded.',retry:'Retry',mesh:'meshes',part:'parts'},
 fa:{catalog:'کاتالوگ محصولات',catalogSub:'یک سیستم را برای بررسی انتخاب کنید',library:'۷ مطالعه سه‌بعدی تعاملی',components:'اجزا',function:'عملکرد',details:'نکات فنی',source:'منبع مدل',search:'جست‌وجوی اجزا…',explode:'بازکردن اجزا',assemble:'مونتاژ',reset:'بازنشانی',auto:'چرخش خودکار',hotspots:'نقاط تعاملی',focus:'تمرکز',loading:'در حال بارگذاری مدل سه‌بعدی',clickHint:'روی مدل یا نقاط تعاملی کلیک کنید',ready:'مدل آماده است',failed:'منبع مدل سه‌بعدی بارگذاری نشد.',retry:'تلاش مجدد',mesh:'مش',part:'قطعه'}
};

const state={lang:localStorage.getItem('pm-lang')==='fa'?'fa':'en',productId:localStorage.getItem('pm-product')||'camera',selectedId:null,auto:false,exploded:false,hotspots:true,loading:true,error:null,progress:0,modelIndex:0,mobilePanel:null};
let renderer,labelRenderer,scene,camera,controls,root,modelBox,modelSize,modelCenter,raycaster,pointer,resizeObserver,raf,focusAnim;
let meshes=[], meshState=new Map(), hotspotObjects=new Map(), highlighted=[];
let explodeAnim=null;
const loader=new GLTFLoader();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const product=()=>PRODUCTS.find(p=>p.id===state.productId)||PRODUCTS[0];
const tx=o=>o?.[state.lang]??o?.en??''; const t=k=>UI[state.lang][k]||k;
const comp=id=>product().components.find(c=>c[0]===id);

function setDir(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='fa'?'rtl':'ltr'}
function shell(){
 setDir(); const p=product(); if(!comp(state.selectedId))state.selectedId=p.components[0][0];
 document.querySelector('#app').innerHTML=`<div class="app">
  <header class="header">
   <div class="brand"><div class="brand-code">3D</div><div><h1>Product Manual Project</h1><p>Industrial Object Intelligence</p></div></div>
   <div class="header-marquee"><b>LIVE PRODUCT LAB</b> ${tx(p.name)} / ${tx(p.type)} / ${p.code}</div>
   <div class="header-actions"><button class="header-btn mobile-products" id="mobileProducts" aria-label="Products">☰</button><div class="lang"><button data-lang="en" class="${state.lang==='en'?'active':''}">EN</button><button data-lang="fa" class="${state.lang==='fa'?'active':''}">FA</button></div><button class="header-btn mobile-info" id="mobileInfo" aria-label="Info">i</button></div>
  </header>
  <main class="workspace">
   <aside class="product-rail ${state.mobilePanel==='products'?'open':''}" id="productRail"><div class="rail-head"><div class="kicker">${t('catalogSub')}</div><h2>${t('catalog')}</h2></div><div class="product-list">${PRODUCTS.map((x,i)=>productCard(x,i)).join('')}</div><div class="rail-foot"><b>${t('library')}</b><br>${state.lang==='fa'?'مدل‌های آماده با منبع و مجوز قابل ردیابی':'Ready-made models with traceable sources and licensing.'}</div></aside>
   <section class="stage-wrap" id="stage"><div id="threeHost"></div><div class="stage-top"><div class="stage-title"><span class="eyebrow">${p.code} · ${tx(p.type)}</span><h2>${tx(p.name)}</h2><p>${tx(p.subtitle)} — ${t('clickHint')}</p></div><div class="model-stats" id="modelStats">—</div></div><div class="stage-bottom"><div class="toolbox"><button class="tool primary" data-action="explode">${state.exploded?t('assemble'):t('explode')}</button><button class="tool" data-action="reset">↺ ${t('reset')}</button><button class="tool ${state.auto?'on':''}" data-action="auto">◉ ${t('auto')}</button><button class="tool ${state.hotspots?'on':''}" data-action="hotspots">＋ ${t('hotspots')}</button></div><div class="status-chip"><span></span>${state.loading?t('loading'):state.error?t('failed'):t('ready')}</div></div>${loadingHTML()}</section>
   <aside class="inspector ${state.mobilePanel==='info'?'open':''}" id="inspector">${inspectorHTML()}</aside>
  </main>
 </div>`;
 bindUI(); initThree();
}
function productCard(p,i){return `<button class="product-card ${p.id===state.productId?'active':''}" data-product="${p.id}"><span class="product-index">${String(i+1).padStart(2,'0')}</span><span><div class="name">${tx(p.name)}</div><div class="type">${tx(p.type)}</div></span><span class="arrow">↗</span></button>`}
function selected(){return comp(state.selectedId)||product().components[0]}
function inspectorHTML(){const p=product(),c=selected();return `<div class="inspector-head"><div><div class="kicker">${t('components')}</div><h2>${tx(c[1])}</h2></div><div class="big-no">${String(p.components.indexOf(c)+1).padStart(2,'0')}</div></div><div class="inspector-scroll"><div class="info-block"><h3>${t('function')}</h3><p>${tx(c[3])}</p></div><div class="info-block"><h3>${t('details')}</h3><div class="specs">${c[4].map(s=>`<div class="spec">${s}</div>`).join('')}</div></div><div class="info-block"><h3>${t('source')}</h3><p>${p.credit}</p></div><div class="component-list">${p.components.map((x,i)=>`<button class="component-btn ${x[0]===state.selectedId?'active':''}" data-component="${x[0]}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${tx(x[1])}</span><span>↗</span></button>`).join('')}</div></div><div class="search-wrap"><input id="componentSearch" placeholder="${t('search')}" /></div>`}
function loadingHTML(){if(!state.loading&&!state.error)return '';return `<div class="loading"><div class="loading-card"><div class="loading-top"><span>${product().code}</span><span>${state.error?'ERR':Math.round(state.progress)+'%'}</span></div><h3>${state.error?t('failed'):t('loading')}</h3>${state.error?`<div class="error">${escapeHTML(state.error)}</div><button class="retry" id="retry">${t('retry')}</button>`:`<div class="load-track"><div class="load-fill" style="width:${state.progress}%"></div></div><div class="kicker">${product().urls[Math.min(state.modelIndex,product().urls.length-1)]}</div>`}</div></div>`}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function bindUI(){
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('pm-lang',state.lang);destroyThree();shell()});
 document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>switchProduct(b.dataset.product));
 document.querySelectorAll('[data-component]').forEach(b=>b.onclick=()=>selectComponent(b.dataset.component,true));
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 document.querySelector('#retry')?.addEventListener('click',()=>{state.error=null;state.loading=true;state.progress=0;state.modelIndex=0;refreshLoading();loadCurrentModel()});
 document.querySelector('#mobileProducts')?.addEventListener('click',()=>togglePanel('products'));
 document.querySelector('#mobileInfo')?.addEventListener('click',()=>togglePanel('info'));
 document.querySelector('#componentSearch')?.addEventListener('input',e=>filterComponents(e.target.value));
}
function togglePanel(which){state.mobilePanel=state.mobilePanel===which?null:which;document.querySelector('#productRail')?.classList.toggle('open',state.mobilePanel==='products');document.querySelector('#inspector')?.classList.toggle('open',state.mobilePanel==='info')}
function filterComponents(q){const needle=q.trim().toLowerCase();document.querySelectorAll('.component-btn').forEach((b,i)=>{const c=product().components[i];b.style.display=!needle||[tx(c[1]),c[1].en,c[1].fa,...c[4]].join(' ').toLowerCase().includes(needle)?'grid':'none'})}
function switchProduct(id){if(id===state.productId)return;state.productId=id;state.selectedId=null;state.exploded=false;state.modelIndex=0;state.progress=0;state.error=null;state.loading=true;localStorage.setItem('pm-product',id);destroyThree();shell()}
function refreshInspector(){const i=document.querySelector('#inspector');if(i){i.innerHTML=inspectorHTML();i.querySelectorAll('[data-component]').forEach(b=>b.onclick=()=>selectComponent(b.dataset.component,true));i.querySelector('#componentSearch')?.addEventListener('input',e=>filterComponents(e.target.value))}updateHotspotActive()}
function refreshLoading(){const stage=document.querySelector('#stage');const old=stage?.querySelector('.loading');if(old)old.remove();if(stage&&(state.loading||state.error))stage.insertAdjacentHTML('beforeend',loadingHTML());document.querySelector('#retry')?.addEventListener('click',()=>{state.error=null;state.loading=true;state.progress=0;state.modelIndex=0;refreshLoading();loadCurrentModel()})}

function initThree(){
 const host=document.querySelector('#threeHost'); if(!host)return;
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x161713);
 camera=new THREE.PerspectiveCamera(38,1,.01,100);camera.position.set(3.6,2.4,5.2);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.domElement.className='webgl';host.appendChild(renderer.domElement);
 labelRenderer=new CSS2DRenderer();labelRenderer.domElement.className='labels-layer';host.appendChild(labelRenderer.domElement);
 const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;pmrem.dispose();
 scene.add(new THREE.HemisphereLight(0xfff4dc,0x1e211b,1.7));const key=new THREE.DirectionalLight(0xffe3c2,5);key.position.set(4,6,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0xff6a32,3.2);rim.position.set(-5,2,-4);scene.add(rim);const fill=new THREE.DirectionalLight(0xb8ff75,1.15);fill.position.set(2,-1,-5);scene.add(fill);
 const floor=new THREE.Mesh(new THREE.CircleGeometry(2.65,64),new THREE.MeshStandardMaterial({color:0x22231e,roughness:.75,metalness:.05}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.32;floor.receiveShadow=true;scene.add(floor);
 controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.065;controls.minDistance=2.15;controls.maxDistance=9;controls.target.set(0,0,0);controls.autoRotateSpeed=.8;
 raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',onModelClick);
 resizeObserver=new ResizeObserver(resize);resizeObserver.observe(host);resize();loadCurrentModel();loop();
}
function resize(){const h=document.querySelector('#threeHost');if(!h||!renderer)return;const w=Math.max(1,h.clientWidth),hh=Math.max(1,h.clientHeight);renderer.setSize(w,hh,false);labelRenderer.setSize(w,hh);camera.aspect=w/hh;camera.updateProjectionMatrix()}
function clearModel(){highlighted.forEach(restoreHighlight);highlighted=[];hotspotObjects.forEach(o=>o.removeFromParent());hotspotObjects.clear();if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose?.();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose?.())}})}root=null;meshes=[];meshState.clear();}
function loadCurrentModel(){
 clearModel();state.loading=true;state.error=null;state.progress=0;refreshLoading();const p=product();const url=p.urls[state.modelIndex];
 loader.load(url,g=>{prepareModel(g.scene);state.loading=false;state.error=null;state.progress=100;refreshLoading();syncStatus();},ev=>{if(ev.total){state.progress=Math.min(99,ev.loaded/ev.total*100);refreshLoading()}},err=>{console.warn('Model load failed',url,err);if(state.modelIndex<p.urls.length-1){state.modelIndex++;state.progress=0;loadCurrentModel()}else{state.loading=false;state.error=`${err?.message||'Network or CORS error'} — ${url}`;refreshLoading();syncStatus()}})
}
function prepareModel(m){
 root=new THREE.Group();scene.add(root);root.add(m);m.updateMatrixWorld(true);
 let box=new THREE.Box3().setFromObject(m);let size=box.getSize(new THREE.Vector3());let center=box.getCenter(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z)||1;const scale=2.65/max;m.scale.setScalar(scale);m.position.sub(center.multiplyScalar(scale));m.updateMatrixWorld(true);
 modelBox=new THREE.Box3().setFromObject(root);modelSize=modelBox.getSize(new THREE.Vector3());modelCenter=modelBox.getCenter(new THREE.Vector3());
 meshes=[];root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;meshes.push(o);meshState.set(o,{pos:o.position.clone()})}});
 createHotspots();frameModel();selectComponent(state.selectedId,false);syncStatus();
}
function hotspotBaseWorld(c){const n=c[2];return new THREE.Vector3(modelCenter.x+n[0]*modelSize.x,modelCenter.y+n[1]*modelSize.y,modelCenter.z+n[2]*modelSize.z)}
function hotspotWorld(c){const obj=hotspotObjects.get(c[0]);if(obj){return obj.getWorldPosition(new THREE.Vector3())}return hotspotBaseWorld(c)}
function createHotspots(){hotspotObjects.forEach(o=>o.removeFromParent());hotspotObjects.clear();product().components.forEach((c,i)=>{const el=document.createElement('button');el.className='hotspot';el.type='button';el.dataset.cid=c[0];el.innerHTML=`<span class="hotspot-dot"></span><span class="hotspot-label">${String(i+1).padStart(2,'0')} ${tx(c[1])}</span>`;el.addEventListener('click',e=>{e.stopPropagation();selectComponent(c[0],true)});const obj=new CSS2DObject(el);const world=hotspotBaseWorld(c);const hostMesh=nearestMeshes(world,1)[0];if(hostMesh){hostMesh.add(obj);obj.position.copy(hostMesh.worldToLocal(world.clone()))}else{scene.add(obj);obj.position.copy(world)}obj.visible=state.hotspots;hotspotObjects.set(c[0],obj)});updateHotspotActive()}
function updateHotspotActive(){hotspotObjects.forEach((o,id)=>{o.visible=state.hotspots;o.element.classList.toggle('active',id===state.selectedId)})}
function frameModel(){if(!modelSize)return;controls.target.copy(modelCenter);const radius=modelSize.length()*.62;const dir=new THREE.Vector3(1.1,.62,1.55).normalize();camera.position.copy(modelCenter).add(dir.multiplyScalar(Math.max(3.1,radius*2.15)));camera.near=.01;camera.far=100;camera.updateProjectionMatrix();controls.update()}
function nearestMeshes(point,count=2){return meshes.map(m=>{const b=new THREE.Box3().setFromObject(m);const c=b.getCenter(new THREE.Vector3());return {m,d:c.distanceTo(point)}}).sort((a,b)=>a.d-b.d).slice(0,Math.min(count,meshes.length)).map(x=>x.m)}
function selectComponent(id,focus=true){const c=comp(id);if(!c||!modelSize)return;state.selectedId=id;refreshInspector();highlighted.forEach(restoreHighlight);highlighted=[];const p=hotspotWorld(c);nearestMeshes(p,Math.min(2,Math.max(1,Math.round(meshes.length/10)))).forEach(highlightMesh);if(focus)focusOn(p);if(innerWidth<=860){state.mobilePanel='info';document.querySelector('#inspector')?.classList.add('open')}}
function highlightMesh(m){if(!m.material)return;const orig=m.material;m.userData.__origMaterial=orig;const arr=(Array.isArray(orig)?orig:[orig]).map(mat=>{const x=mat.clone();if('emissive' in x){x.emissive=new THREE.Color(0xff5a1f);x.emissiveIntensity=.42}if('roughness' in x)x.roughness=Math.min(1,(x.roughness??.5)+.08);return x});m.material=Array.isArray(orig)?arr:arr[0];highlighted.push(m)}
function restoreHighlight(m){if(m.userData.__origMaterial){const current=Array.isArray(m.material)?m.material:[m.material];current.forEach(x=>x!==m.userData.__origMaterial&&x.dispose?.());m.material=m.userData.__origMaterial;delete m.userData.__origMaterial}}
function focusOn(target){const currentTarget=controls.target.clone(),currentPos=camera.position.clone();const offset=currentPos.clone().sub(currentTarget);const desiredDist=Math.max(1.9,Math.min(3.2,offset.length()*.62));const desiredPos=target.clone().add(offset.normalize().multiplyScalar(desiredDist));if(reduceMotion){controls.target.copy(target);camera.position.copy(desiredPos);return}focusAnim={start:performance.now(),duration:650,fromT:currentTarget,toT:target.clone(),fromP:currentPos,toP:desiredPos}}
function onModelClick(e){if(!root||state.loading)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(meshes,true)[0];if(!hit)return;let best=null,bd=Infinity;product().components.forEach(c=>{const d=hit.point.distanceTo(hotspotWorld(c));if(d<bd){bd=d;best=c}});if(best)selectComponent(best[0],true)}
function action(a){if(a==='reset')frameModel();if(a==='auto'){state.auto=!state.auto;controls.autoRotate=state.auto;syncToolButtons()}if(a==='hotspots'){state.hotspots=!state.hotspots;updateHotspotActive();syncToolButtons()}if(a==='explode')toggleExplode()}
function syncToolButtons(){document.querySelectorAll('[data-action="auto"]').forEach(b=>b.classList.toggle('on',state.auto));document.querySelectorAll('[data-action="hotspots"]').forEach(b=>b.classList.toggle('on',state.hotspots))}
function toggleExplode(){if(!root||!meshes.length)return;state.exploded=!state.exploded;const strength=Math.max(.28,modelSize.length()*.16);const items=[];meshes.forEach(m=>{const base=meshState.get(m)?.pos;if(!base)return;let target=base.clone();if(state.exploded){const wb=new THREE.Box3().setFromObject(m),wc=wb.getCenter(new THREE.Vector3());let worldDir=wc.clone().sub(modelCenter);if(worldDir.lengthSq()<.0001)worldDir=new THREE.Vector3((Math.random()-.5),(.15+Math.random()*.3),(Math.random()-.5));worldDir.normalize().multiplyScalar(strength);const p0=m.parent.worldToLocal(wc.clone());const p1=m.parent.worldToLocal(wc.clone().add(worldDir));target.add(p1.sub(p0))}items.push({m,from:m.position.clone(),to:target})});explodeAnim={start:performance.now(),duration:reduceMotion?1:720,items};document.querySelectorAll('[data-action="explode"]').forEach(b=>{b.textContent=state.exploded?t('assemble'):t('explode');b.classList.toggle('on',state.exploded)});selectComponent(state.selectedId,false)}
function syncStatus(){const s=document.querySelector('#modelStats');if(s)s.innerHTML=`<b>${String(meshes.length).padStart(2,'0')}</b> ${t('mesh')}<br><b>${String(product().components.length).padStart(2,'0')}</b> ${t('part')}`;}
function loop(now=performance.now()){raf=requestAnimationFrame(loop);if(!renderer)return;if(focusAnim){const u=Math.min(1,(now-focusAnim.start)/focusAnim.duration),e=1-Math.pow(1-u,3);controls.target.lerpVectors(focusAnim.fromT,focusAnim.toT,e);camera.position.lerpVectors(focusAnim.fromP,focusAnim.toP,e);if(u>=1)focusAnim=null}if(explodeAnim){const u=Math.min(1,(now-explodeAnim.start)/explodeAnim.duration),e=.5-Math.cos(Math.PI*u)/2;explodeAnim.items.forEach(x=>x.m.position.lerpVectors(x.from,x.to,e));if(u>=1)explodeAnim=null}controls.autoRotate=state.auto;controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera)}
function destroyThree(){if(raf)cancelAnimationFrame(raf);resizeObserver?.disconnect();clearModel();controls?.dispose();renderer?.dispose();renderer?.domElement?.remove();labelRenderer?.domElement?.remove();renderer=labelRenderer=scene=camera=controls=null;hotspotObjects.clear()}

shell();
</script>
