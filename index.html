:root{

*{box-sizing:border-box} html,body,#app{width:100%;height:100%;margin:0} body{overflow:hidden;background:radial-gradient(circle at 50% 35%,#13212d 0,#0a1018 36%,#06090d 78%);font-family:Inter,system-ui,sans-serif;color:var(--text)}

.nav{display:flex;gap:4px;margin-inline:auto}.nav button,.icon-btn,.control-btn,.tree-item,.search-result,.action{border:0;background:transparent;cursor:pointer}.nav button{padding:10px 12px;border-radius:12px;color:var(--muted);transition:.2s}.nav button:hover,.nav button.active{color:var(--text);background:rgba(255,255,255,.07)}
.top-actions{display:flex;align-items:center;gap:8px}.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.lang button{border:0;background:transparent;color:var(--muted);padding:8px 9px;cursor:pointer}.lang button.active{background:rgba(125,221,244,.12);color:var(--cyan)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.035)}.icon-btn:hover{background:rgba(255,255,255,.08)}

.sidebar{min-height:0;overflow:hidden;display:flex;flex-direction:column}.panel-head{padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.06)}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:.12em;text-transform:uppercase}.panel-head h2{font-size:18px;margin:4px 0 0;letter-spacing:-.02em}.panel-body{padding:14px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.search-wrap{position:relative;margin-bottom:14px}.search-input{width:100%;padding:12px 38px 12px 12px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);outline:none}.search-input:focus{border-color:rgba(125,221,244,.45);box-shadow:0 0 0 3px rgba(125,221,244,.08)}html[dir="rtl"] .search-input{padding:12px 12px 12px 38px}.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}html[dir="rtl"] .search-icon{right:auto;left:12px}
.search-results{position:absolute;top:48px;left:0;right:0;background:rgba(9,14,21,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;max-height:270px;overflow:auto}.search-result{display:block;width:100%;padding:10px 12px;color:var(--text);text-align:start;border-bottom:1px solid rgba(255,255,255,.05)}.search-result:hover{background:rgba(125,221,244,.08)}
.category{margin-bottom:16px}.category-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 6px 7px}.tree-item{display:flex;width:100%;align-items:center;gap:10px;color:#c4cfda;padding:10px;border-radius:12px;text-align:start;transition:.18s}.tree-item:hover,.tree-item.active{background:rgba(125,221,244,.085);color:#fff}.dot{width:7px;height:7px;border-radius:50%;background:#547089;box-shadow:0 0 0 4px rgba(84,112,137,.12)}.tree-item.active .dot{background:var(--cyan);box-shadow:0 0 0 4px rgba(125,221,244,.13)}

.loading{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 42%,#14222d,#070b10 70%);display:grid;place-items:center;text-align:center;transition:opacity .5s,visibility .5s}.loading.hidden{opacity:0;visibility:hidden}.loading-card{width:min(420px,calc(100% - 34px))}.silhouette{width:150px;height:96px;margin:0 auto 24px;border:1px solid rgba(255,255,255,.13);border-radius:18px;position:relative;box-shadow:inset 0 0 28px rgba(125,221,244,.06)}.silhouette:before{content:"";position:absolute;width:74px;height:56px;border-radius:50%;border:1px solid rgba(125,221,244,.38);left:50%;top:50%;transform:translate(-50%,-50%)}.silhouette:after{content:"";position:absolute;width:54px;height:16px;border-radius:8px 8px 0 0;background:rgba(255,255,255,.07);top:-10px;left:18px}.loading h1{font-size:22px;margin:0 0 8px}.loading p{color:var(--muted);margin:0 0 18px;font-size:13px}.progress{height:5px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--cyan2));transition:width .2s}.progress-meta{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:12px}.load-error{margin-top:18px;padding:13px;border:1px solid rgba(255,142,142,.2);background:rgba(255,142,142,.06);border-radius:12px;color:#ffc3c3;font-size:13px}.action{padding:9px 12px;border-radius:11px;background:rgba(125,221,244,.12);color:var(--cyan);margin-top:10px}
.modal-layer{position:fixed;inset:0;z-index:80;background:rgba(1,4,7,.62);backdrop-filter:blur(12px);display:grid;place-items:center;padding:20px}.modal{width:min(760px,100%);max-height:min(760px,90vh);overflow:auto;border:1px solid var(--line);border-radius:24px;background:rgba(11,17,25,.96);box-shadow:var(--shadow)}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);background:rgba(11,17,25,.93);backdrop-filter:blur(20px)}.modal-head h2{font-size:18px;margin:0}.modal-body{padding:20px}.modal-body p,.modal-body li{color:#c5d0da;line-height:1.75;font-size:14px}.cards{display:grid;gap:10px}.card{padding:14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.035)}.card h3{font-size:15px;margin:0 0 7px}.card p{margin:0}.card button{margin-top:10px}
.guide-step{display:flex;gap:14px;align-items:flex-start}.step-index{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(125,221,244,.12);color:var(--cyan);font-weight:700;flex:0 0 auto}
.toast{position:fixed;z-index:100;left:50%;bottom:92px;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:10px 13px;border-radius:12px;background:rgba(8,13,20,.93);border:1px solid var(--line);color:#d8e5ef;font-size:12px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-panel-toggle{display:none}
@media(max-width:1180px){.workspace{grid-template-columns:240px minmax(360px,1fr) 300px}.nav{display:none}}
@media(max-width:900px){body{overflow:hidden}.topbar{margin:8px 8px 0;height:62px;border-radius:17px;padding:0 11px}.brand small{display:none}.workspace{grid-template-columns:1fr;padding:8px;height:calc(100% - 70px)}.viewer{grid-row:1}.sidebar{position:absolute;top:82px;bottom:10px;width:min(88vw,340px);z-index:35;transition:transform .28s}.sidebar.left{left:8px;transform:translateX(calc(-100% - 16px))}.sidebar.right{right:8px;transform:translateX(calc(100% + 16px))}.sidebar.open{transform:translateX(0)}.mobile-panel-toggle{display:grid}.top-actions{margin-inline-start:auto}.bottom-controls{bottom:10px}.control-btn .label{display:none}.viewer-badge{top:12px;left:12px}.topbar .desktop-only{display:none}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

function setLanguage(lang){
  state.lang=lang; localStorage.setItem('3dpm-lang',lang); const selection=state.selected?.id; const modal=state.modal; const guide=state.guideStep; teardownThree(); renderShell(); state.selected=selection?findComponent(selection):null; state.modal=modal; state.guideStep=guide; refreshPanels(); document.querySelector('#modalRoot').innerHTML=modalHTML(); bindUI();

function renderSearch(q){

function openView(view){

function toggleMobilePanel(side){

function setupThree(){
  const host=document.querySelector('#viewer'); if(!host || renderer)return;
  scene=new THREE.Scene();
  clock=new THREE.Clock();
  camera=new THREE.PerspectiveCamera(38,1,.05,100); camera.position.set(4.5,2.6,5.6);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; host.prepend(renderer.domElement);
  labelRenderer=new CSS2DRenderer(); labelRenderer.setSize(host.clientWidth,host.clientHeight); labelRenderer.domElement.style.position='absolute'; labelRenderer.domElement.style.inset='0'; labelRenderer.domElement.style.pointerEvents='none'; host.appendChild(labelRenderer.domElement);
  controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.055; controls.minDistance=2.2; controls.maxDistance=9; controls.target.set(0,0,0); controls.autoRotate=false; controls.autoRotateSpeed=.7;
  controls.addEventListener('start',()=>{state.focusAnim=null});
  const pmrem=new THREE.PMREMGenerator(renderer); const env=new RoomEnvironment(); scene.environment=pmrem.fromScene(env,.04).texture; pmrem.dispose(); env.dispose();
  scene.add(new THREE.HemisphereLight(0xbfe8ff,0x17202c,1.0));
  const key=new THREE.DirectionalLight(0xdaf5ff,3.1); key.position.set(4,6,5); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
  const fill=new THREE.DirectionalLight(0x7ea9ff,1.4); fill.position.set(-5,2,3); scene.add(fill);
  const rim=new THREE.DirectionalLight(0x6fe8ff,1.8); rim.position.set(2,1,-5); scene.add(rim);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x0d151e,roughness:.45,metalness:.15,transparent:true,opacity:.72})); floor.rotation.x=-Math.PI/2; floor.position.y=-1.55; floor.receiveShadow=true; scene.add(floor);
  raycaster=new THREE.Raycaster(); pointer=new THREE.Vector2(); renderer.domElement.addEventListener('pointerdown',onPointerDown);
  resizeObserver=new ResizeObserver(resize); resizeObserver.observe(host); resize(); renderer.setAnimationLoop(animate); loadModel();
}

function teardownThree(){
  resizeObserver?.disconnect(); resizeObserver=null;
  if(renderer){renderer.setAnimationLoop(null); renderer.domElement.removeEventListener('pointerdown',onPointerDown); renderer.dispose(); renderer.domElement.remove();}
  labelRenderer?.domElement.remove(); renderer=null; labelRenderer=null; scene=null; camera=null; controls=null; state.model=null; state.normalizedRoot=null; state.meshes=[]; state.meshOriginals.clear(); state.hotspotObjects.clear(); state.associatedMeshes.clear();
}
function resize(){const host=document.querySelector('#viewer'); if(!host||!renderer)return; const w=host.clientWidth,h=host.clientHeight; renderer.setSize(w,h,false); labelRenderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();}

function loadModel(){
  if(!scene)return; state.loading=true; state.loadError=null; refreshLoading();
  if(state.model){scene.remove(state.model); state.model=null;}
  const url=product.modelUrls[state.modelUrlIndex]; const loader=new GLTFLoader();
  loader.load(url,gltf=>{prepareModel(gltf.scene); state.loading=false; state.loadPercent=100; refreshLoading();},progress=>{
    if(progress.total){state.loadPercent=Math.max(2,Math.min(99,Math.round(progress.loaded/progress.total*100)));} else state.loadPercent=Math.min(92,state.loadPercent+2); refreshLoading();
  },err=>{
    console.warn('Model load failed',url,err);
    if(state.modelUrlIndex<product.modelUrls.length-1){state.modelUrlIndex++; state.loadPercent=0; refreshLoading(); loadModel();}
    else {state.loadError=state.lang==='fa'?'مدل سه‌بعدی بارگذاری نشد. اتصال اینترنت و CORS را بررسی کنید.':'The 3D model could not be loaded. Check network access and CORS.'; refreshLoading();}
  });
}
function refreshLoading(){
  const current=document.querySelector('#loadingOverlay'); if(!current)return; const temp=document.createElement('div'); temp.innerHTML=loadingHTML(); current.replaceWith(temp.firstElementChild); document.querySelector('#retryLoad')?.addEventListener('click',()=>{state.loadError=null;state.modelUrlIndex=0;state.loadPercent=0;loadModel();});
}

function prepareModel(root){
  const wrapper=new THREE.Group(); wrapper.name='ProductRoot'; wrapper.add(root); scene.add(wrapper); state.model=wrapper; state.normalizedRoot=root;
  const box=new THREE.Box3().setFromObject(root); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3()); const scale=3.6/Math.max(size.x,size.y,size.z); root.scale.setScalar(scale); root.position.copy(center).multiplyScalar(-scale); root.updateMatrixWorld(true);
  const box2=new THREE.Box3().setFromObject(root); const c2=box2.getCenter(new THREE.Vector3()); root.position.sub(c2); root.updateMatrixWorld(true);
  state.meshes=[]; root.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;obj.frustumCulled=true; state.meshes.push(obj); state.meshOriginals.set(obj,{position:obj.position.clone(),material:obj.material}); if(Array.isArray(obj.material))obj.material=obj.material.map(m=>m.clone()); else if(obj.material)obj.material=obj.material.clone();}});
  createHotspots(); associateMeshes(); controls.target.set(0,0,0); camera.position.set(4.4,2.5,5.2); controls.update();
}

function hotspotPosition(comp){
  const [x,y,z]=comp.hotspot; return new THREE.Vector3(x*2.5,y*2.5,z*2.5);
}
function createHotspots(){
  for(const obj of state.hotspotObjects.values()) obj.parent?.remove(obj); state.hotspotObjects.clear();
  product.components.forEach(comp=>{
    const el=document.createElement('button'); el.className='hotspot'; el.dataset.id=comp.id; el.innerHTML=`<i class="hotspot-pulse"></i><span class="hotspot-label">${tx(comp.name)}</span>`; el.style.pointerEvents='auto'; el.addEventListener('click',e=>{e.stopPropagation();selectComponent(comp.id,true);});
    const label=new CSS2DObject(el); label.position.copy(hotspotPosition(comp)); state.model.add(label); state.hotspotObjects.set(comp.id,label);
  });
}
function updateHotspotLabels(){state.hotspotObjects.forEach((o,id)=>{const el=o.element; const comp=findComponent(id); const s=el.querySelector('.hotspot-label'); if(s)s.textContent=tx(comp.name); el.classList.toggle('active',state.selected?.id===id);});}
function associateMeshes(){
  state.associatedMeshes.clear(); state.model.updateMatrixWorld(true);
  for(const comp of product.components){
    const hp=hotspotPosition(comp).clone(); state.model.localToWorld(hp); let best=null,bestD=Infinity;
    for(const mesh of state.meshes){const b=new THREE.Box3().setFromObject(mesh); if(b.isEmpty())continue; const p=b.getCenter(new THREE.Vector3()); const d=p.distanceToSquared(hp); if(d<bestD){bestD=d;best=mesh;}}
    if(best) state.associatedMeshes.set(comp.id,best);
  }
}

function selectComponent(id,focus=false){
  const c=findComponent(id); if(!c)return; state.selected=c; restoreHighlight(); const mesh=state.associatedMeshes.get(id); if(mesh) highlightMesh(mesh); updateHotspotLabels(); refreshPanels();
  if(focus) focusComponent(c,mesh); if(innerWidth<=900){document.querySelector('#rightPanel')?.classList.add('open'); document.querySelector('#leftPanel')?.classList.remove('open');}
}
function highlightMesh(mesh){
  const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material]; selectedMaterialRestore=[];
  mats.forEach(m=>{if(!m)return; selectedMaterialRestore.push({m,emissive:m.emissive?.clone(),emissiveIntensity:m.emissiveIntensity,color:m.color?.clone()}); if(m.emissive){m.emissive.set(0x143f50);m.emissiveIntensity=.75;} else if(m.color){m.color.offsetHSL(0,.05,.08)} m.needsUpdate=true;});
}
function restoreHighlight(){selectedMaterialRestore.forEach(r=>{if(r.emissive&&r.m.emissive)r.m.emissive.copy(r.emissive); if(typeof r.emissiveIntensity==='number')r.m.emissiveIntensity=r.emissiveIntensity; if(r.color&&r.m.color)r.m.color.copy(r.color); r.m.needsUpdate=true;}); selectedMaterialRestore=[];}
function focusComponent(comp,mesh){
  let target=hotspotPosition(comp); if(mesh){const b=new THREE.Box3().setFromObject(mesh); target=b.getCenter(new THREE.Vector3());} else state.model.localToWorld(target);
  const currentTarget=controls.target.clone(); const dir=camera.position.clone().sub(currentTarget).normalize(); const distance=Math.max(2.35,Math.min(4.2,camera.position.distanceTo(currentTarget)*.72)); const nextPos=target.clone().add(dir.multiplyScalar(distance)).add(new THREE.Vector3(0,.25,0));
  state.focusAnim={start:performance.now(),duration:reduceMotion?1:750,fromPos:camera.position.clone(),toPos:nextPos,fromTarget:currentTarget,toTarget:target.clone()};
}

function onPointerDown(e){
  if(!state.meshes.length)return; const rect=renderer.domElement.getBoundingClientRect(); pointer.x=((e.clientX-rect.left)/rect.width)*2-1; pointer.y=-((e.clientY-rect.top)/rect.height)*2+1; raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(state.meshes,true); if(!hits.length)return;
  const p=hits[0].point; let best=null,bestD=Infinity; for(const comp of product.components){const hp=hotspotPosition(comp); state.model.localToWorld(hp); const d=hp.distanceToSquared(p); if(d<bestD){bestD=d;best=comp;}} if(best)selectComponent(best.id,true);
}

function handleAction(action){
  if(action==='reset')resetCamera(); else if(action==='explode')setExploded(true); else if(action==='assemble')setExploded(false); else if(action==='auto'){state.autoRotate=!state.autoRotate;controls.autoRotate=state.autoRotate;refreshPanels();} else if(action==='full')toggleFullscreen();
}
function resetCamera(){state.focusAnim={start:performance.now(),duration:reduceMotion?1:700,fromPos:camera.position.clone(),toPos:new THREE.Vector3(4.4,2.5,5.2),fromTarget:controls.target.clone(),toTarget:new THREE.Vector3(0,0,0)};}
function setExploded(on){
  state.exploded=on; const modelCenter=new THREE.Box3().setFromObject(state.normalizedRoot).getCenter(new THREE.Vector3());
  state.meshes.forEach((mesh,i)=>{const original=state.meshOriginals.get(mesh)?.position?.clone()||mesh.position.clone(); mesh.userData.explodeFrom=mesh.position.clone(); let dir=new THREE.Vector3(); const b=new THREE.Box3().setFromObject(mesh); const wc=b.getCenter(new THREE.Vector3()); dir.copy(wc).sub(modelCenter); if(dir.lengthSq()<.0001)dir.set(Math.sin(i*1.7),Math.cos(i*.8)*.5,Math.cos(i*1.3)); dir.normalize(); const parent=mesh.parent; const startWorld=wc.clone(); const endWorld=wc.clone().add(dir.multiplyScalar(.55+Math.min(1.1,b.getSize(new THREE.Vector3()).length()*.16))); const p1=parent.worldToLocal(startWorld.clone()); const p2=parent.worldToLocal(endWorld.clone()); const localOffset=p2.sub(p1); mesh.userData.explodeTo=on?original.clone().add(localOffset):original; mesh.userData.explodeT=0;}); refreshPanels();
}
function updateExplosion(dt){
  let changed=false; for(const mesh of state.meshes){if(!mesh.userData.explodeTo||mesh.userData.explodeT>=1)continue; const from=mesh.userData.explodeFrom; const to=mesh.userData.explodeTo; mesh.userData.explodeT=Math.min(1,mesh.userData.explodeT+dt*(reduceMotion?20:2.1)); const k=ease(mesh.userData.explodeT); mesh.position.lerpVectors(from,to,k); changed=true;} if(changed){state.model.updateMatrixWorld(true); state.hotspotObjects.forEach((o,id)=>{const mesh=state.associatedMeshes.get(id); if(mesh){const b=new THREE.Box3().setFromObject(mesh); const world=b.getCenter(new THREE.Vector3()); state.model.worldToLocal(world); o.position.copy(world);}});}
}
function toggleFullscreen(){const el=document.querySelector('.app-shell'); if(!document.fullscreenElement)el.requestFullscreen?.(); else document.exitFullscreen?.();}
function ease(x){return 1-Math.pow(1-x,3)}

function animate(){
  if(!renderer)return; const dt=Math.min(clock.getDelta(),.05); controls.update(); updateExplosion(dt);
  if(state.focusAnim){const a=state.focusAnim; const p=Math.min(1,(performance.now()-a.start)/a.duration); const k=ease(p); camera.position.lerpVectors(a.fromPos,a.toPos,k); controls.target.lerpVectors(a.fromTarget,a.toTarget,k); if(p>=1)state.focusAnim=null;}
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
}

function showToast(msg){const e=document.querySelector('#toast'); if(!e)return;e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}

renderShell();

  </script>
